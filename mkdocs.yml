site_name: Mercatus Liber
site_description: >-
  A free, open-source commerce toolkit — schema, cart, catalog, multi-site, templates, discounts. Wrap Stripe, don't rebuild PCI.

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - search.suggest
    - toc.follow
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
plugins:
  - search
