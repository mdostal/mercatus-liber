# Mercatus Liber -- framework-level brand system
# Produced by plugin-hive:brand-system (bs-01-brand-system-tokens, framework-brand-system epic)
# Scope: the FRAMEWORK's own identity only (landing page, docs site, this brand guide).
# Explicitly NOT packages/theming's 10 demo-facing ThemeBundles (classic/dark/minimal/
# vibrant/retro/high-contrast/northline/editorial/maximalist/datasheet) -- those are each
# demo store's own identity and are untouched by this file. See "grounding" below for how
# every choice here was checked against those 10 bundles' actual token values to avoid
# collision, not just against generic "AI design tell" advice.
#
# .pHive/brand/brand-system.yaml

grounding:
  project: >
    Mercatus Liber ("free market", Latin) -- a free, MIT-licensed, headless commerce
    framework. Not a SaaS product; no paid tier baked into core. Primary audience:
    developers evaluating whether to adopt it. Real differentiators this brand had to
    signal honestly: schema-first catalog, marketing-catalog genuinely separate from
    sales catalog, adapter-swappable everything (payments/persistence/CMS/analytics/
    admin-auth), AI-agent-accessible via the same interfaces humans use.
  avoided_generic_ai_tells:
    - "warm cream + serif + terracotta (already artifact-design's own named cliche, and
       literally what packages/theming's 'classic' bundle already does -- #fdfbf7 +
       Iowan Old Style/Palatino serif. This system uses a neutral, non-warm paper
       surface and a single sans/mono type pairing instead, deliberately outside that
       territory.)"
    - "near-black background + one neon accent pop (the other named cliche -- this
       system stays light-surface-first with a single mid-saturation indigo accent,
       not a dark-mode-by-default neon treatment.)"
    - "Inter / Space Grotesk chosen as an unexamined 'safe default' -- this system uses
       Public Sans (USWDS's plain-legibility civic typeface) and JetBrains Mono (a
       typeface literally built for reading code), each with an explicit reason tied
       to this project's own character, not a default reached for out of habit."
  checked_against_theme_bundles: >
    Every hue and font family below was diffed against packages/theming/src/theme-
    bundles.ts's actual --color-primary/--color-accent/--color-background/--font-family
    values for all 10 bundles (read-only comparison; that file was never edited).
    Findings: warm cream/ivory backgrounds are already claimed 4x over (classic
    #fdfbf7, retro #fdf6e3, editorial #F2E9D8, maximalist #EEF0E6); burnt-orange/rust
    primaries are already claimed 4x over (retro #cb4b16, editorial #B14B2A,
    maximalist #FF4515, datasheet #C8460A); cool light-slate backgrounds are claimed
    2x (northline #f8fafc, datasheet #F1F3F6); blue primaries claimed 3x (classic
    #1d4ed8, dark #60a5fa, northline #1e40af); IBM Plex Sans is claimed by datasheet;
    Archivo is claimed by maximalist. Violet/indigo, brick-red/garnet, and a true
    neutral (non-warm, non-cool) gray-white are unclaimed by any of the 10 bundles --
    this system deliberately occupies that open territory so the framework brand reads
    as distinct from, not competing with, any demo store sitting beneath it.

colors:
  primary:
    name: "Ledger Indigo"
    hex: "#4338A0"
    rgb: "rgb(67, 56, 160)"
    cmyk: "cmyk(58, 65, 0, 37)"
    pms: "PMS 2685 C (approx. -- indicative nearest match, not a certified swatch-book match; no Pantone matching tool was available)"
    usage: >
      The system's one confident accent -- primary CTAs, links, focus states, active
      nav state. Deliberately singular: everywhere else stays neutral so this color
      keeps its weight. Desaturated relative to a typical "SaaS blurple" so it reads
      as considered ink rather than a gradient-button trend color.
    contrast:
      vs_white: "9.08:1 (AAA, normal text)"
      vs_black: "2.31:1 (fails as text-on-black; use as a fill with white text instead)"
  secondary:
    name: "Garnet"
    hex: "#A13A3A"
    rgb: "rgb(161, 58, 58)"
    cmyk: "cmyk(0, 64, 64, 37)"
    pms: "PMS 7621 C (approx. -- indicative nearest match, not a certified swatch-book match)"
    usage: >
      Alerts, destructive actions (delete adapter config, cancel order), rare emphasis.
      A muted brick/garnet rather than a bright alert-red or the rust/terracotta
      oranges already claimed by 4 of the 10 demo bundles -- same "serious, not loud"
      register as the primary, different hue family so the two never get confused at
      a glance.
    contrast:
      vs_white: "6.60:1 (AA normal text, AAA large text)"
      vs_black: "3.18:1 (fails as text-on-black; use as a fill with white text, or as large/bold text only)"
  neutral:
    name: "Carbon Ink"
    hex: "#1A1A1D"
    rgb: "rgb(26, 26, 29)"
    cmyk: "cmyk(10, 10, 0, 89)"
    pms: "PMS Black 6 C (approx.)"
    usage: >
      Body text and headings. A true neutral near-black (imperceptible warmth or
      coolness) -- distinct from the warm near-blacks in classic (#1c1917), editorial
      (#17130F) and maximalist (#241C14), and from the cool near-blacks in northline
      (#0f172a) and datasheet (#12151B). Reads as plain ink on paper, not a stylistic
      pick either direction.
    contrast:
      vs_white: "17.36:1 (AAA)"
      vs_black: "1.21:1 (n/a -- this is the near-black itself)"
  surface:
    name: "Paper Neutral"
    hex: "#F3F3F1"
    rgb: "rgb(243, 243, 241)"
    cmyk: "cmyk(0, 0, 1, 5)"
    pms: "PMS Cool Gray 1 C (approx.)"
    usage: >
      Page background, cards, containers. A true neutral gray-white (not the warm
      ivories 4 bundles already use, not the cool slates 2 bundles already use) --
      picked specifically to be the unclaimed middle ground so the framework's own
      surface doesn't echo any one demo store's temperature.
    contrast:
      vs_white: "1.11:1 (n/a -- this is the near-white itself)"
      vs_black: "18.90:1 (AAA for near-black text on this surface)"

typography:
  heading_font: "Public Sans"
  body_font: "Public Sans"
  # Additive field beyond the base schema (parallel precedent: concept_directions
  # below is also additive). Design-discussion §2a explicitly calls for "a
  # monospace or semi-monospace accent face for code-adjacent UI chrome (nav, labels)
  # paired with a plain, highly legible body/heading face" -- this is that third role.
  accent_font: "JetBrains Mono"
  accent_font_usage: >
    Nav labels, badges/pills (e.g. "MIT", "pre-alpha", adapter names), version
    numbers, inline code, the wordmark's tagline lockup. Never body copy at length --
    it's UI chrome, not a reading face.
  font_rationale: >
    One plain text face (Public Sans, USWDS's civic-infrastructure typeface -- built
    for maximum neutral legibility, not a "SaaS default") does double duty for both
    headings and body: restraint in typography mirrors restraint in color (one
    confident accent, not several). Public Sans was chosen over Inter/Space Grotesk
    specifically because those are the two "safe default" faces the project's own
    artifact-design guidance already names as generic-AI-design tells -- and over IBM
    Plex Sans / Archivo because those are already claimed by the datasheet and
    maximalist demo bundles respectively. JetBrains Mono is a genuine, load-bearing
    choice, not decoration: it's a typeface literally designed for reading code
    day-to-day, which is exactly this framework's own stated differentiator (schema-
    first, adapter-swappable, AI-and-human-equal interfaces) -- using it for UI chrome
    signals "built by and for people who read code" rather than just claiming it in
    prose.
  scale: [12, 14, 16, 18, 24, 32, 48, 64]
  weights:
    - weight: 400
      name: "Regular"
      usage: "Body text, captions, long-form docs copy"
    - weight: 500
      name: "Medium"
      usage: "Labels, nav items, table headers"
    - weight: 600
      name: "SemiBold"
      usage: "Subheadings, emphasis, card titles"
    - weight: 700
      name: "Bold"
      usage: "Page headings, hero copy, primary CTAs"
  usage_guidance: >
    Public Sans for every reading and heading context, at the weight table above.
    JetBrains Mono only for the accent_font_usage contexts listed -- if in doubt,
    default to Public Sans; the mono face should stay rare enough to keep its signal.

spacing:
  base: 4 # px, 4-point grid -- the same widely-used convention packages/theming's
          # own "classic" bundle applies at demo-store level; a shared grid convention
          # isn't a collision (it's not visually distinctive on its own), only the
          # specific scale/ratio below is this system's own.
  scale: [4, 8, 12, 16, 24, 32, 48, 64, 96]

radius:
  small: 2
  medium: 4
  large: 8
  full: 9999
  rationale: >
    Tighter corners than every demo bundle except "minimal" (which uses 0px) --
    classic uses 6px, vibrant 12px. Sharp-but-not-stark corners read as precise and
    structured (schema-first, adapter-typed) rather than soft/friendly-retail, which
    is the right register for framework-level chrome sitting above loud, varied demo
    storefronts, without going all the way to minimal's completely square edges.

personality:
  statement: >
    Mercatus Liber is real, free infrastructure -- not a demo, not a funnel. It reads
    like the code it ships: direct, exact, and built to be taken apart.
  tone: "direct, precise, unembellished, confident"
  voice_principles:
    - "Say what's actually true, including the pre-alpha parts and the parts that
       don't work yet -- credibility comes from precision, not polish (see README.md's
       own 'Status: pre-alpha' framing, which this brand should never paper over)."
    - "One accent color, one text face, one mono face: restraint is a design decision,
       not an omission. Every additional color or face has to earn its place."
    - "Every visual choice should read as legible and un-gimmicky to someone who reads
       schemas and diffs for a living -- that's the actual audience, not a generic
       'developer persona.'"
    - "Never visually borrow from or collide with any of the 10 demo-store theme
       bundles this brand sits above -- the framework is the frame, not one more
       theme in the list."

# Additive field, sanctioned by the brand-system skill's own prompt spec (parallel to
# how logo-exploration reads this same array downstream when openai-image is live).
# The two bracket/ledger directions below are no longer purely speculative -- they were
# actually built as inline-SVG marks in this pass (see logo_decision below) -- but they
# remain real, honest follow-on scope for a future *image-backed* exploration once
# openai-image reconnects, since nothing here has been rendered through that path yet.
concept_directions:
  - "monospace wordmark, no icon -- the name set in the accent mono face, doing all the work (built: three pure-wordmark cards in brand-guide.html)"
  - "bracket/slash lockup using literal type-system glyphs ( / < > ) referencing adapter interfaces (built: the 'adapter slot' abstract mark, its wordmark+symbol pairing, and its badge treatment)"
  - "ruled-line or ledger-row motif referencing an open market ledger (built: the ledger-ML monogram)"

logo_decision:
  status: >
    Three parallel option sets now exist, neither selected: (1) inline-SVG fallback,
    five concept categories in brand-guide.html (pure wordmark x3, monogram "ledger
    ML", abstract mark "adapter slot", wordmark + symbol, badge); (2) a genuine
    image-backed exploration round 1, 12 real candidate PNGs (4 per
    concept_directions entry below) generated via Google Gemini (gemini-3-pro-image,
    disclosed substitution for the still-disconnected openai-image -- see
    image_exploration block below and brand-guide.html's Logo Concepts section for
    the full disclosure); (3) a second image-backed exploration round, 21 more real
    candidate PNGs -- the human reviewer of round (2) wasn't sold on any of those 12
    (all single-color Ledger Indigo) and asked to see color, so round 2 both
    recolors the cleanest candidate from each of round 1's three directions into
    three new colorways apiece (9 images) and explores three genuinely new concept
    directions, each in four different colors (12 images) -- see
    image_exploration_round_2 below for the full provenance. No selection has been
    made among any of the three sets -- that is a human decision, not this pass's to
    make. selected.yaml is deliberately NOT written by any automated pass; it is
    written by the human reviewer per hive/references/logo-exploration-artifacts.md.
  image_exploration:
    path: ".pHive/brand/logo-explorations/20261007T171307Z/"
    contact_sheet: ".pHive/brand/logo-explorations/20261007T171307Z/contact-sheet.html"
    prompts_log: ".pHive/brand/logo-explorations/20261007T171307Z/prompts.md"
    model: "gemini-3-pro-image (\"Nano Banana Pro\", stable, not a preview model)"
    candidates_generated: "12 of 12 (4 per concept_directions entry, 3 directions) -- all succeeded, no failures"
    provider_substitution: >
      plugin-hive:logo-exploration's own primary image-generation path requires the
      openai-image MCP tool. Re-checked live immediately before this run: the
      openai-image MCP server still reports CONNECTION_CLOSED, and this repo's own
      root .mcp.json still lists no openai-image entry at all (only
      reference-storefront-commerce and sanity) -- unchanged from the prior pass's
      finding. Rather than leave the image-backed path unattempted indefinitely, this
      pass substituted Google Gemini's gemini-3-pro-image model, using a real,
      already-verified-working API key (Portunus reference
      personalsites-487021-google_generative_ai_api_key, already used for image
      generation on the operator's other sites). This is a disclosed substitution,
      not a silent one -- same disclosure spirit as the existing inline-SVG
      fallback's own notice.
    transparency_check: >
      Verified live before the full run: gemini-3-pro-image's generateContent
      response always has mimeType image/jpeg (confirmed via decoded-byte inspection,
      PIL mode == RGB, no alpha channel), even when the prompt explicitly asked for a
      transparent PNG background -- that request instead produced a literal
      checkerboard pattern baked into the pixels as drawn content, not real
      transparency. All 12 candidates therefore use a clean solid white background
      instead; a true-alpha version of any selected candidate would need standard
      background-removal post-processing as a separate follow-on step.
    selection_status: >
      Open. contact-sheet.html is the human review surface. Picking a winner (from
      either the image-backed set or the inline-SVG set) and writing selected.yaml is
      explicitly left to a human reviewer, per
      hive/references/logo-exploration-artifacts.md's own ownership split --
      not decided or assumed by this pass.
  image_exploration_round_2:
    path: ".pHive/brand/logo-explorations/20261007T181824Z/"
    contact_sheet: ".pHive/brand/logo-explorations/20261007T181824Z/contact-sheet.html"
    prompts_log: ".pHive/brand/logo-explorations/20261007T181824Z/prompts.md"
    model: "gemini-3-pro-image (\"Nano Banana Pro\", stable, not a preview model) -- same as round 1"
    rationale: >
      The human reviewer of round 1's 12 Ledger-Indigo-only candidates said: "not
      certain I like any of them... maybe we need to try with some colors so i can
      see something there." Asked to confirm scope, they explicitly said to go wide
      on color (no constraint to the established Ledger Indigo palette -- even a
      color that might eventually beat Ledger Indigo as the mark's own color is fair
      game here, though changing the sitewide accent is a separate, later, human
      decision) and to do both: recolor the existing 3 directions for easier
      evaluation, and generate genuinely fresh concept directions too.
    candidates_generated: >
      21 of 21 -- all succeeded, no failures. Part A (recolor): 9 images, 3 bases (one
      hand-picked cleanest candidate per round-1 direction) x 3 colorways each,
      generated via Gemini's real image-input (inlineData) edit capability -- not
      fresh from-scratch generation -- to hold mark geometry fixed while changing
      only ink color; the image-input request shape was verified with one real test
      call before committing to all 9. Part B (fresh directions): 12 images, 3 new
      concept directions (direction-4 open-market/agora, direction-5 node-graph/
      decoupled-subsystems, direction-6 open-unlocked-form/"Liber") x 4 different
      colors each.
    colors_used: >
      Ledger Indigo #4338A0 (established baseline, included for direct comparison),
      Brass Amber #96620B, Deep Jade Teal #0F6B5C, and Carbon Ink #1A1A1D (same
      near-black already used for neutral/body tone elsewhere in this file). Amber
      and teal were chosen as dark, desaturated, ink-weight hues deliberately
      avoiding generic AI-palette cliches (no pastel cream/terracotta pairing, no
      neon-on-black pop) -- see prompts.md for the full one-line reasoning per hex.
    directory_naming_adaptation: >
      Because this round mixes a recolor pass against round 1's existing 3
      directions with 3 brand-new directions, the artifact contract's plain
      direction-<N>/ layout was adapted: direction-1-recolor/, direction-2-recolor/,
      direction-3-recolor/ (3 images each, reusing round 1's direction numbers so a
      human can match recolors back to their round-1 originals) and direction-4/,
      direction-5/, direction-6/ (4 images each, numbered to continue past round 1's
      1/2/3 so there is no collision). Documented in full in prompts.md.
    selection_status: >
      Open, same ownership split as round 1 -- contact-sheet.html is the review
      surface, selected.yaml is written by a human, not assumed by this pass.
  reason: >
    plugin-hive:logo-exploration's image-generation path requires the openai-image
    MCP tool. Re-checked live in this session (not assumed from the earlier pass's
    note): the openai-image MCP server reports CONNECTION_CLOSED, and separately this
    repo's own root .mcp.json lists only two server entries -- reference-storefront-
    commerce and sanity -- no openai-image entry at all. So logo-exploration remains
    unavailable by both the live-connectivity check and the config-presence check the
    brand-system skill itself uses to decide primary vs. fallback path; that part of
    the story is unchanged from the prior pass. What changed across the prior two
    passes: pass 2 added four inline-SVG concept categories (wordmark + symbol,
    monogram, abstract mark, badge) alongside the original three wordmark variants,
    all hand-authored SVG grounded in the project's own adapter-swappable-everything
    metaphor and the existing palette, not image-generated and not placeholder
    shapes. Pass 3 (this one) finally delivers the genuine image-backed icon
    exploration flagged as real open follow-up in pass 2 -- not by waiting for
    openai-image to reconnect, but via a disclosed Gemini substitution, since the
    operator explicitly asked for that substitution and a working, already-verified
    Gemini API key exists in Portunus. See image_exploration above for the full
    provenance. Remaining real open follow-up, honestly: (1) selecting a final mark
    among all the options now available (image-backed or inline-SVG), which is
    deliberately left to the human, not decided here; (2) if a badge-style image
    candidate is the eventual pick, regenerating the repo's actual favicon and GitHub
    social-preview image from it is a real follow-on task, not done as part of this
    brand-artifact pass; (3) if openai-image ever does reconnect, a further
    openai-image-backed pass would be a genuine additional data point, not required
    to unblock selection since a real image-backed set already exists now.

image_exploration_refinement:
  base: "logo-explorations/20261007T181824Z/direction-4/1.png (open market/agora, Brass Amber)"
  reason: >
    User reviewed both exploration rounds and picked direction 4 (open market/agora),
    Brass Amber colorway, as the winner -- with an explicit refinement ask: make the
    roofline a solid M and one tent-leg an L to "really sell the M L shape," or
    alternatively lean into a fuller market-stall-with-food-area scene.
  edits_dir: "logo-explorations/20261007T181824Z/edits/"
  candidates:
    - direction-4-candidate-1-edit-0.png  # solid M + tent-pole L -- strongest, reads unmistakably as "ML"
    - direction-4-candidate-1-edit-1.png  # solid M + both-legs-as-L -- M reads more as a crown than a letter
    - direction-4-candidate-1-edit-2.png  # market-stall-with-goods -- weaker letterform legibility
    - direction-4-candidate-1-edit-3.png  # market-stall-with-awning-fringe -- weakest letterform legibility
  status: "awaiting final human selection"
