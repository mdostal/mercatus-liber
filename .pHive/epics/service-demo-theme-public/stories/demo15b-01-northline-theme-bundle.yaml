    depends_on: [research]
  - id: test
    description: Update theme-bundles.test.ts's count assertion to 7; add northline-specific assertions mirroring the existing per-bundle checks.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify no token value collides with any of the other 6 bundles.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

