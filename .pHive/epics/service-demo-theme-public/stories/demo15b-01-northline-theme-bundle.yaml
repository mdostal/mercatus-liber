description: |
  Adds a 7th ThemeBundle ("northline") to packages/theming/src/theme-bundles.ts
  -- the same pure-composition shape as the existing 6 (per docs/brand-and-
  scope.md's invented Northline Home Tech identity: indigo-blue primary,
  amber accent, light slate background, professional tone). Zero new
  infrastructure, same as theme-01's original story.

acceptance_criteria:
  - "Given THEME_BUNDLES, when inspected, then it has exactly 7 bundles including 'northline', with a unique key and a token palette that doesn't collide with any of the other 6"
  - "Given applyTheme(themingService, getThemeBundle('northline')), when called, then getTokens()/resolveTemplate('pdp') reflect it, same proof pattern as every other bundle"
  - "Given the package's existing 'ships exactly 6 bundles' test, when updated, then it reflects 7 without weakening any other assertion"

