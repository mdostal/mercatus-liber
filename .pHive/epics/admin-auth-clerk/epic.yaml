name: admin-auth-clerk
title: Admin Authentication (Clerk)
description: >
  Every /admin route requires real authentication -- a genuine, silent, and currently
  live-exploitable security gap (no auth existed anywhere in /admin before this epic). New
  subsystem 21 (@mercatus-liber/admin-auth, core-only dependency) is the swappable
  AdminAuthAdapter contract + a zero-infra dev default, mirroring CatalogPersistenceAdapter/
  CmsPersistenceAdapter/BiMetricsAdapter exactly. The real, deployed implementation is a new
  sibling package, @mercatus-liber/adapter-clerk, wrapping Clerk's Next.js and Backend SDKs --
  the user's explicit, deliberate choice ("we will be building on clerk 100%"), not a
  disclosed-but-deferred option. Three roles (owner/admin/viewer), role data lives in Clerk's
  own publicMetadata (no second local database to drift). Enforced two-layered: root
  middleware.ts (authentication) + app/admin/layout.tsx and a requireAdminPermission guard on
  every existing admin mutation action (authorization). Live end-to-end verification is
  pending the user's real Clerk credentials -- disclosed gap, same posture as epic 18's Sanity
  credentials. See docs/subsystems/21-admin-auth.md and docs/design-discussion.md.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
