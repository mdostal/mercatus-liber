    new-subsystem: "Design question (contract shape, where role data lives, two-layer enforcement) required resolving before decomposition"
    admin-ui: "New /admin/settings/users page for owner-level role management"
    existing-surface-change: "The only epic in this wave that reaches into every prior epic's admin mutation actions at once, not just one new surface"
    external-credential: "Real Clerk credentials are required for live verification and were not present in this environment's vault at planning time -- disclosed, tracked as an open item, not blocking the buildable-now portions"
  confidence: high
