description: |
  New package packages/admin-auth (subsystem 21, see docs/subsystems/21-admin-auth.md,
  already written during planning). Depends on @mercatus-liber/core only -- never imports
  Clerk or any identity provider (that's adapter-clerk's job, a later piece of work).

  Read .pHive/epics/admin-auth-clerk/docs/design-discussion.md section 3 for the exact
  contract shape and reasoning (role data belongs in Clerk's own metadata, not a second local
  database -- this package doesn't know or care that Clerk exists, it just declares the shape
  a real implementation must satisfy).

  Mirror packages/internal-bi/src/types.ts's doc-comment convention (the most recently built
  adapter contract in this repo) for the exact "this is the swappable contract" framing.

  Deliverables:
  - `AdminRole` type: "owner" | "admin" | "viewer".
  - `AdminSession` type: { userId: string; email: string; role: AdminRole }.
  - `AdminAuthAdapter` interface: { getCurrentSession(): Promise<AdminSession | null>;
    listAdminUsers(): Promise<{ userId: string; email: string; role: AdminRole }[]>;
    setAdminUserRole(userId: string, role: AdminRole): Promise<void> }.
  - `hasPermission(role: AdminRole, action: "view" | "mutate" | "manage_users"): boolean` --
    pure function. owner: true for all three. admin: true for "view"/"mutate", false for
    "manage_users". viewer: true for "view" only, false for "mutate"/"manage_users".
  - `createDefaultAdminAuthAdapter(): AdminAuthAdapter` -- a zero-infra, LOCAL-DEVELOPMENT-ONLY
    default. getCurrentSession() checks a session cookie (name your own constant, e.g.
    "ml_admin_dev_session") set by a small helper this package also exports (e.g.
    `verifyDevPassword(password: string): boolean`, comparing against
    process.env.ADMIN_DEV_PASSWORD) -- when the cookie is present and valid, always resolves
    role "owner" (single-operator dev mode, matching how this repo's other in-memory defaults
    are "good enough to run without infra, not a production security boundary" -- put that
    exact caveat in a loud doc comment on this factory function). listAdminUsers/
    setAdminUserRole on the default adapter can be minimal (e.g. return a single synthetic
    "dev-owner" entry; setAdminUserRole can no-op or throw "not supported in dev mode" --
    document whichever you choose clearly, since this default is never meant to model
    multi-user role management, only single-operator local dev).
  - index.ts re-exporting the public surface.

acceptance_criteria:
  - "Given role 'owner', when hasPermission is called for each of 'view'/'mutate'/'manage_users', then all three return true"
  - "Given role 'admin', when hasPermission is called for 'view' and 'mutate', then both return true; for 'manage_users', it returns false"
  - "Given role 'viewer', when hasPermission is called for 'view', then it returns true; for 'mutate' and 'manage_users', both return false"
  - "Given createDefaultAdminAuthAdapter() with no session cookie present, when getCurrentSession() is called, then it returns null"
  - "Given createDefaultAdminAuthAdapter() with a valid dev-session cookie present, when getCurrentSession() is called, then it returns a session with role 'owner'"
  - "Given verifyDevPassword is called with a value that doesn't match process.env.ADMIN_DEV_PASSWORD, then it returns false (and true for a matching value)"

