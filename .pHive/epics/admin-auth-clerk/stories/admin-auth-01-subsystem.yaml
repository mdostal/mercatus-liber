design_decisions:
  - decision: "The dev default's listAdminUsers/setAdminUserRole are intentionally minimal (single synthetic owner, no-op or throw on role change)."
    rationale: "This default models single-operator local development only -- multi-user role management is adapter-clerk's real job, not something worth faking here."
  - decision: "getCurrentSession() takes no arguments on either implementation."
    rationale: "Matches Next.js App Router's implicit request-context convention (next/headers, Clerk's own auth()) -- both the dev default and the real Clerk adapter read ambient context themselves rather than requiring callers to thread a Request object through."

