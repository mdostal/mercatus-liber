design_decisions:
  - decision: "Missing or invalid publicMetadata.role always resolves to 'viewer', never a more-privileged default."
    rationale: "Fail-closed is the only safe default for an access-control adapter -- a malformed or not-yet-set role must never accidentally grant elevated access."
  - decision: "The adapter factory accepts an injectable Clerk client dependency, defaulting to the real import."
    rationale: "Matches this repo's dependency-injection convention everywhere else and is what makes the fail-closed/role-mapping logic testable without live credentials."

