design_decisions:
  - decision: "Middleware handles authentication (logged in or not); the admin layout + per-action guards handle authorization (which role can do what)."
    rationale: "Route-level middleware can't cleanly express per-role, per-action rules -- the two-layer split matches design-discussion.md §3's explicit reasoning."

risks:
  - severity: high
    description: "Missing the guard on even one of the 12 mutation actions would leave a real hole in an otherwise-fixed security gap."
    mitigation: "The review step explicitly checks all 12, not just the tested sample -- and the acceptance criteria call this out by name."

references:
