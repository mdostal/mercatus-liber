    relevant_excerpt: |
      "Sanity: a real, previously-undetected bug was found and fixed live [...] but Sanity itself
      was reverted out of production after that crash and not yet re-attempted with the fix live."
      -- contradicted by vercel env ls production showing the env vars ARE set today; this story
      resolves which claim is actually true.
