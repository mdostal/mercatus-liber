id: scc-01-verify-sanity-production-health
epic: sanity-challenge-commerce-copilot
title: Verify (and fix forward if needed) production Sanity health
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  apps/reference-storefront/lib/services.ts:709-715 wires a real Sanity-backed CmsPersistenceAdapter
  in whenever SANITY_PROJECT_ID is set. `vercel env ls production` confirms SANITY_PROJECT_ID/
  SANITY_DATASET/SANITY_TOKEN ARE currently set on Vercel Production (7-8 days old as of
  2026-09-19), contradicting a stale .pHive/planning/epic-backlog.md row-56 note claiming Sanity
  was "reverted out of production." The known prior crash (a real _id namespace collision between
  marketing-page-meta docs and page docs) is fixed in code via marketingMetaDocId()
  (packages/adapter-sanity/src/mapping.ts:62), covered by a regression test
  (packages/adapter-sanity/test/adapter.test.ts:107). Whether production is ACTUALLY serving
  without erroring has never been directly checked post-fix. This story does that check for real,
  fixes forward if something is still broken, and corrects the stale backlog note either way.

  Do NOT assume prod is healthy just because env vars are set, and do NOT assume it's broken just
  because of the stale note -- check directly.

acceptance_criteria:
  - "Given production commerce.mdostal.com with Sanity active, when every CMS-backed route is hit directly (home pages, category pages, marketing/campaign pages, /admin/cms across all 3 demos), then zero 500s occur"
  - "Given the check found a real bug, when it's fixed, then the fix is verified live in production the same way every prior epic this session verified (deploy, then re-check the exact failing route)"
  - "Given the check completes either way, when .pHive/planning/epic-backlog.md row 56 is updated, then it reflects the real, current, verified state -- not the stale 'reverted' claim"

steps:
  - id: research
    description: Read packages/adapter-sanity/src/*.ts in full, confirm marketingMetaDocId's fix covers every doc-type collision (not just the one bug already found), and list every real route that reads through CmsService in this app.
    agent: researcher
  - id: implement
    description: Hit every CMS-backed production route directly (curl or equivalent) with Sanity active. If any 500s or silently-wrong content is found, diagnose and fix forward using the same discipline as the rest of this session (verify locally against real infra first when possible, then verify live, revert immediately on any regression this story itself introduces).
    agent: developer
    depends_on: [research]
  - id: test
    description: If a fix was needed, add/extend a regression test in packages/adapter-sanity/test/ mirroring the existing marketingMetaDocId test's shape.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review the live-verification evidence and any fix for correctness.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/sanity-challenge-commerce-copilot. Update epic-backlog.md row 56 with the real, current finding.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
  key_files:
    - path: apps/reference-storefront/lib/services.ts
      purpose: "Line 709-715: the real env-var branch that constructs the Sanity adapter"
    - path: packages/adapter-sanity/src/mapping.ts
      purpose: "marketingMetaDocId() at line 62 -- the already-fixed collision logic to verify is sufficient"
    - path: .pHive/planning/epic-backlog.md
      purpose: "Row 56 -- the stale note this story must correct with the real finding"

references:
