    change: New package depending on @mercatus-liber/core only
  - file: packages/marketing-catalog/src/types.ts
    change: Category entity, repository interfaces, CatalogAttributeLookup structural interface
  - file: packages/marketing-catalog/src/service.ts
    change: Category CRUD, hierarchy, assignment, suggestion rules

cross_cutting:
  - concern: subsystem-decoupling
    action: "packages/marketing-catalog/src must never import @mercatus-liber/catalog directly -- structural interface only, per the prime directive"
