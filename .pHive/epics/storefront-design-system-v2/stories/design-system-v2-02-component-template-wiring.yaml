    file: apps/reference-storefront/app/demo/[demoSlug]/products/[slug]/page.tsx
    snippet: |
      const PDP_TEMPLATES: Record<string, ComponentType<PdpProps>> = {
        "pdp.tabbed-detail": PdpTabbedDetail,
        "pdp.long-scroll": PdpLongScroll,
      };
      const templateKey = theming.resolveTemplate("pdp");
      const Template = PDP_TEMPLATES[templateKey] ?? PdpTabbedDetail;

