id: design-system-v2-02-component-template-wiring
epic: storefront-design-system-v2
title: "Wire shared render components to branch on resolveTemplate() per page type"
status: pending
complexity: high
methodology: classic
depends_on: [design-system-v2-01-template-registry-and-bundles]

description: |
  Read the prior story's committed changes in full first -- the template keys registered
  there (nav.top-bar/nav.rail, home.standard-grid/home.magazine-grid/home.spec-grid,
  category.standard-grid/category.magazine-grid/category.spec-grid,
  cart.standard/cart.receipt-style/cart.spec-table) and the 3 new bundles' exact token values
  are the spec for this story's rendering work.

  Follow the EXACT existing pattern already proven for PDP -- do not invent a different
  mechanism. apps/reference-storefront/app/demo/[demoSlug]/products/[slug]/page.tsx already
  does this for pageType "pdp": it imports one component per template key
  (PdpTabbedDetail/PdpLongScroll from components/pdp-tabbed-detail.tsx and
  components/pdp-long-scroll.tsx), builds a `{ "pdp.tabbed-detail": PdpTabbedDetail,
  "pdp.long-scroll": PdpLongScroll }` lookup map, calls the theming service's
  resolveTemplate("pdp") to get the active key, and renders the matching component. Replicate
  this exact structure for the 4 newly-covered page types:

  1. **nav** (apps/reference-storefront/app/demo/[demoSlug]/layout.tsx, the shop-nav layout) --
     new components components/nav-top-bar.tsx (extract today's current nav markup verbatim
     into this file, zero visual change) and components/nav-rail.tsx (a real fixed left-rail
     nav, per "Blaze Theme"'s left-rail jump-nav pattern -- collapses to a top bar on narrow
     viewports, same responsive behavior the source design demonstrated).
  2. **home** (each demo's app/demo/[demoSlug]/page.tsx, which currently renders CMS home-page
     sections via components/cms-sections.tsx) -- new components/home-standard-grid.tsx
     (today's current section-rendering behavior, extracted verbatim),
     components/home-magazine-grid.tsx (asymmetric feature-card grid layout wrapping the same
     CMS section data, per "The Slow Catalog"), components/home-spec-grid.tsx (dense datasheet
     grid wrapping the same CMS section data, per "Datasheet Storefront"). These wrap/reorganize
     how cms-sections.tsx's existing section renderers are laid out on the page -- they do NOT
     duplicate or fork cms-sections.tsx's own per-section-type rendering logic.
  3. **category** (app/demo/[demoSlug]/category/[slug]/page.tsx or equivalent) -- same 3-way
     split as home, wrapping the existing product-grid rendering.
  4. **cart** (app/demo/[demoSlug]/cart/page.tsx) -- new components/cart-standard.tsx (today's
     current layout, extracted verbatim), components/cart-receipt-style.tsx (monospace,
     itemized-receipt visual treatment per "The Slow Catalog", same real cart data/actions),
     components/cart-spec-table.tsx (a literal data-table layout per "Datasheet Storefront",
     same real cart data/actions). All three MUST preserve every existing cart interaction
     (quantity update, remove line, checkout button, coupon field if present) -- this is a
     visual/layout wrapper around the real cart logic, not a reimplementation of it.

  Token usage: every new component must consume the theme tokens via CSS custom properties
  (`var(--token-name, <literal fallback>)`), exactly matching epic 32's established pattern --
  every reference to a token not defined on all 7 pre-existing bundles (--color-muted,
  --color-border, --space-*, --font-size-*, --shadow-card, and the new --font-family-display)
  MUST carry a literal fallback value so the 7 old bundles keep rendering correctly through
  these same components where applicable (nav and cart render for every bundle regardless of
  which page-type template resolves).

  Do not change any existing PDP component -- pdp.tabbed-detail/pdp.long-scroll and their
  components are untouched by this story; only their consumption of the 3 new bundles' tokens
  (already correct, since tokens flow through CSS custom properties automatically) needs no
  code change at all.

acceptance_criteria:
  - "Given the nav layout rendered under the maximalist bundle, then nav.rail (left-rail nav) renders; under any other bundle (editorial, datasheet, or any of the 7 pre-existing bundles), nav.top-bar renders with identical markup/behavior to before this story"
  - "Given a demo home page rendered under editorial, maximalist, and datasheet, then home.magazine-grid, home.standard-grid, and home.spec-grid render respectively, each visually distinct in structure (not just token color values) and each still rendering the real CMS-driven section data correctly"
  - "Given a category page under all 3 new bundles, then the matching category.* template renders with the real seeded product grid data, same product count/data as before this story"
  - "Given the cart page (with real items in cart) under all 3 new bundles, then the matching cart.* template renders, and quantity-update/remove-line/checkout actions all still function -- verified via real server-action form submissions, not just visual inspection"
  - "Given any of the 7 pre-existing bundles (classic, dark, minimal, vibrant, retro, high-contrast, northline) rendered across nav/home/category/cart, then every page renders with NO visual/structural regression versus this story's starting point -- diff against a pre-story snapshot if needed to confirm"
  - "Given every new `var(--token, fallback)` reference introduced by this story, then grep confirms a literal fallback value is present on every one that references a token not in the original 6-token vocabulary"

steps:
  - id: research
    description: Read products/[slug]/page.tsx's exact template-lookup-map pattern and cms-sections.tsx's current section-rendering contract before writing any new component.
    agent: researcher
  - id: implement
    description: Build the nav/home/category/cart template components and wire each page/layout to resolveTemplate(), per the description above.
    agent: developer
    depends_on: [research]
  - id: test
    description: Verify every acceptance criterion above against a real running dev server across all 3 new bundles plus at least 2 of the 7 pre-existing bundles (one light, one dark-ish, to catch fallback contrast issues).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no PDP files were touched, confirm cart interactions still work under all 3 new layouts, confirm fallback values are present on every new token reference.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/storefront-design-system-v2.
    agent: developer
    depends_on: [review]

