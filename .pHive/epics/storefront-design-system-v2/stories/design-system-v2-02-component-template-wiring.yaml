design_decisions:
  - decision: "One component per template variant, looked up via a Record<templateKey, Component> map, exactly mirroring PDP's existing pattern."
    rationale: "Zero new architectural pattern introduced -- the codebase already proves this shape works for PDP; extending it to 4 more page types is mechanical, not novel."
  - decision: "New home/category/cart template components wrap existing section/product/cart-line renderers rather than reimplementing rendering logic."
    rationale: "Keeps CMS section rendering and cart interaction logic single-sourced -- only the surrounding layout/visual treatment varies per template."

risks:
  - severity: high
    description: "Largest diff in the epic -- risk of visually or functionally regressing the 7 existing bundles across 4 page types at once."
    mitigation: "Acceptance criteria explicitly requires testing at least 2 pre-existing bundles across all 4 page types, plus confirming registration order from story 1 keeps their default template selection unchanged."
  - severity: medium
    description: "Cart interactions (quantity update, remove, checkout) are React Server Action form submissions -- easy to visually reskin while accidentally breaking the underlying form wiring."
    mitigation: "Acceptance criteria explicitly requires verifying real server-action submissions, not just visual inspection, for all 3 cart templates."

