design_decisions:
  - decision: "Extend LayoutTemplate/resolveTemplate coverage to 4 more page types instead of a new component-variant mechanism."
    rationale: "See design-discussion.md §2 -- reuses the one existing, proven precedent (PDP) rather than duplicating a mechanism the package already has."
  - decision: "Add one new optional token, --font-family-display, always with a var()-fallback to --font-family."
    rationale: "editorial's real design pairs a serif display face with a different serif body face -- additive and fallback-safe, doesn't touch any of the 7 existing single-font-family bundles."

risks:
  - severity: low
    description: "Registration-order mistake could silently change existing bundles' rendering."
    mitigation: "Acceptance criteria explicitly requires testing resolveTemplate()'s no-override return value for every newly-covered page type."

