name: storefront-design-system-v2
title: "Switchable, component-level theme system from 3 independently designed concepts"
description: >
  Turns the 3 independently designed, personally-verified storefront concepts (produced via the
  user's own blind-parallel-design-agent methodology and published as Artifacts this session)
  into real, switchable, component-level themes -- not another token-only pass like epic 32.
  Resolved design question: extend packages/theming's existing LayoutTemplate/resolveTemplate
  primitive (already proven for PDP's tabbed-detail vs. long-scroll) to cover nav/home/category/
  cart page types instead of inventing a new mechanism -- ThemeBundle's shape is unchanged, only
  template-registry coverage grows. See docs/design-discussion.md.
