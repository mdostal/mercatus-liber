name: adapter-printify
title: "@mercatus-liber/adapter-printify: real Printify print-on-demand fulfillment adapter"
description: >
  Depends on epic 41 (fulfillment-routing, done). A deliberate second, optional POD provider
  (epic 42's Printful is the first, already done). Real marketplace-routing complexity Printful
  doesn't have (Printify: many providers per product) resolved as out-of-scope for this adapter
  -- provider selection is Printify's own platform responsibility once an order targets a
  specific Printify product, same boundary as Printful's mockup/template setup. Real credential
  gate, same disclosed pattern as epics 27, 42, 46. See docs/design-discussion.md.
