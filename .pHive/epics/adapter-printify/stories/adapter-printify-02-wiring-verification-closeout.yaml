description: |
  Read the prior story's committed changes in full first.

  1. Wire the adapter into apps/reference-storefront/lib/services.ts via real
     `PRINTIFY_API_TOKEN`/`PRINTIFY_SHOP_ID` env vars (both required, truthy) -> the real
     Printify adapter, additively registered alongside the manual default and (if configured)
     the Printful adapter from epic 42 -- mirroring epic 42's own additive wiring pattern, not
     a swap. Add/extend the Fulfillment row in lib/adapter-info.ts to report Printify's state
     too.
  2. Check honestly whether a real Printify token/shop id exists anywhere in this environment.
     State the finding plainly -- almost certainly none exists.
  3. Run the full monorepo test/typecheck/build via root turbo commands, confirm green.
  4. Update docs/subsystems/22-fulfillment.md with a real Printify section (mirroring the
     Printful section's structure from epic 42), including the honest credential-gap
     disclosure and the marketplace-routing-is-out-of-scope design note.
  5. Update .pHive/planning/epic-backlog.md: change epic 43's row to an accurate,
     honestly-scoped "done" status naming the credential gap explicitly -- match the
     surrounding rows' style/detail (34-39, 41, 42, 45-47).
  6. Commit and merge feat/adapter-printify into master with --no-ff, mirroring the "Merge epic:
     <name> (epic NN)" convention. Note in the final report that this closes out the entire
     fulfillment-and-shipping thread except epic 44 (shipping), if that's still the accurate
     remaining state at the time this story runs.

acceptance_criteria:
  - "Given PRINTIFY_API_TOKEN and PRINTIFY_SHOP_ID both set, then services.ts constructs the real Printify adapter, registered additively alongside whatever else is configured; given either unset, it's not constructed and the manual default remains available"
  - "Given the credential-availability check, then the final report and epic-backlog.md both honestly state whether a real Printify credential exists in this environment"
  - "Given the full monorepo test/typecheck/build via turbo, then all are green"
  - "Given docs/subsystems/22-fulfillment.md, then it has a real Printify section including the honest disclosure and the marketplace-routing design note"
  - "Given .pHive/planning/epic-backlog.md, then epic 43's row accurately and honestly reflects done-with-a-disclosed-gap status"
  - "Given git log after this story, then master shows a clean --no-ff merge commit for this epic with no conflicts"

