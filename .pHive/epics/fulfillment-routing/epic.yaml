name: fulfillment-routing
title: "New @mercatus-liber/fulfillment subsystem: who/how an order gets fulfilled"
description: >
  Foundational for epics 42-44 (Printful/Printify/Shippo adapters). Confirmed by direct
  inspection: checkout-orders' Order.status has zero notion of a fulfillment provider or
  per-line routing -- every shop today implicitly assumes 100% self-fulfillment. Adopts the
  design already resolved by a real, API-verified concurrent-session research pass
  (.pHive/planning/backlog-addendum-merch-fulfillment-2026-09-09.md): a new subsystem owning
  its own per-order-line fulfillment records, read alongside orders via a narrow OrderLookup-
  shaped structural interface (mirroring internal-bi's existing non-forking relationship to
  Order), never forking checkout-orders' own types. See docs/design-discussion.md.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
