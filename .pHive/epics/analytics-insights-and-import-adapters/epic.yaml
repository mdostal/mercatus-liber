name: analytics-insights-and-import-adapters
title: "AnalyticsInsightsAdapter contract + real GA4/PostHog import adapters + admin Traffic & Sources"
description: >
  Confirmed by direct inspection: analytics' AnalyticsAdapter (PostHog) is write-only, no read
  method anywhere; internal-bi's BiMetricsAdapter is a real owned read-side but has zero notion
  of traffic sources/referrers -- that data only ever exists inside external providers. Resolved
  via a new, separate AnalyticsInsightsAdapter contract (not an extension of BiMetricsAdapter,
  whose whole design premise is internal-persistence-only), real PostHog Query API + GA4 Data
  API adapters (GA4's live path is credential-gated, disclosed honestly per this repo's
  established epic-27 pattern), and an admin Traffic & Sources surface showing every configured
  source side by side, never silently merged. See docs/design-discussion.md.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
methodology: classic
version_bump: minor
sidecar_retention: transient

