  roster: [orchestrator-authored]
  per_tag_reasoning:
    analytics: "The whole point of this epic -- new read-side insights contract + real adapters"
    admin-ui: "New Traffic & Sources surface on /admin/metrics"
    adapters: "Two real third-party adapter implementations, same pattern as every other adapter in this repo"
  confidence: high
  gate_decisions:
    collaborative_review: skipped -- solo-orchestrated planning session, following this session's established convention.

