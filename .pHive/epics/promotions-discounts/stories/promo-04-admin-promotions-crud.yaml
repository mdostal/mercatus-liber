design_decisions:
  - decision: "Plain server-rendered forms, no client-side validation library."
    rationale: "Matches the zero-client-JS-framework posture of every other page in this app; this is a reference/demo storefront+admin, not a production admin console."

risks:
  - severity: low
    description: "This is the first admin mutation surface in the app -- there's no existing precedent to copy exactly, only the shopper-facing lib/actions.ts pattern to adapt."
    mitigation: "Explicitly documented as a new precedent in this story and in design-discussion.md §2, not something to force-fit into the read-only admin pattern."

references:
  - path: .pHive/epics/promotions-discounts/docs/design-discussion.md
