design_decisions:
  - decision: "pricing dep is optional with a built-in pass-through, not a required constructor arg."
    rationale: "Every existing deployment/test wires createCheckoutOrdersService without a promotions concept; making pricing required would be a breaking change to every caller. Optional + pass-through preserves the additive-only version_bump: minor commitment in epic.yaml."
  - decision: "recordApplication is a second optional method on PricingAdjuster, not a separate interface."
    rationale: "Keeps checkout-orders' promotions-facing surface to one named interface (matches the one-interface-per-capability convention used by CartLookup/PaymentSessionCreator) while still letting promo-01's redemption bookkeeping (risk noted in that story) work without checkout-orders owning an order-to-promotion table itself."

risks:
  - severity: medium
    description: "recordApplication's exact signature depends on promo-01's actual committed PromotionsService shape, which may differ slightly from what this story assumes (promo-01 lands first, but the interface details were designed together)."
    mitigation: "Research step explicitly re-reads promo-01's committed source before implementing; adjust the exact method signature to match reality rather than forcing promo-01's code to match this story's guess."

