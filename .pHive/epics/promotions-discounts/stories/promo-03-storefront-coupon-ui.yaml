design_decisions:
  - decision: "Coupon code stored in a cookie, not cart/order state."
    rationale: "Matches this app's existing pattern for shopper-scoped, not-yet-committed state (theme, cart id, customer id all live in cookies here) -- no new state-management concept introduced."

risks:
  - severity: low
    description: "This is the first page in the app to display a grand total at all -- if previewCheckout's Money formatting differs subtly from the existing per-line formatting, the numbers could look inconsistent."
    mitigation: "Reuse the exact same `((amount)/100).toFixed(2)} {currency}` expression already used for per-line totals in this file, applied to previewCheckout's returned total/discountTotal fields."

