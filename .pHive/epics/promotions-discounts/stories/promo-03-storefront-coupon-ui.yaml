files_to_modify:
  - file: apps/reference-storefront/app/cart/page.tsx
    change: Add previewCheckout call, grand-total display, coupon form.
  - file: apps/reference-storefront/lib/actions.ts
    change: Add applyCouponAction; extend startCheckoutAction to pass stored couponCode.
