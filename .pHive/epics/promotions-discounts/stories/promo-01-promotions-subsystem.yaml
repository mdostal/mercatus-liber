code_examples:
  - title: In-memory repository pattern to mirror exactly
    file: packages/cart/src/in-memory-repository.ts
    snippet: |
      export function createInMemoryCartRepository(): CartRepository {
        const carts = new Map<string, Cart>();
        return {
          async get(id: string): Promise<Cart | null> {
            const cart = carts.get(id);
            return cart ? structuredClone(cart) : null;
          },
          async save(cart: Cart): Promise<void> {
            carts.set(cart.id, structuredClone(cart));
          },
        };
      }
  - title: Idempotent event-subscriber guard pattern to mirror
    file: packages/checkout-orders/src/service.ts
    snippet: |
      events.subscribe<{ sessionId: string; orderRef: string | null }>(
        "payments.payment.succeeded",
        async ({ orderRef }) => {
          if (!orderRef) return;
          const order = await repository.get(orderRef);
          if (!order || order.status !== "pending_payment") return; // idempotent guard
          const paid: Order = { ...order, status: "paid" };
          await repository.save(paid);
          await events.publish("checkout.order.paid", { orderId: paid.id });
        },
      );

design_decisions:
  - decision: "evaluate() returns a rejection reason instead of throwing for invalid/expired/exhausted codes."
    rationale: "An invalid coupon code is expected shopper-facing UX ('that code doesn't work'), not an exceptional error -- matches how the wider design-discussion.md frames it."
  - decision: "Redemption-count increments on checkout.order.paid, not checkout.order.placed."
    rationale: "redemptionCount must reflect completed purchases only, per design-discussion.md §5 open question 2 -- an abandoned checkout must not consume a limited coupon's usage slot."

risks:
  - severity: medium
    description: "The service needs to know, at redemption time, which promotion (if any) was applied to a given order -- but evaluate() is a pure computation with no order concept. Naively this needs order-to-promotion bookkeeping."
    mitigation: "Keep this minimal for the reference implementation: an in-memory Map<orderId, {promotionId, discountAmount}> populated by whoever calls evaluate() and decides to proceed to checkout (i.e. checkout-orders' PricingAdjuster caller records the applied promotion against the orderId once the order is created -- see promo-02's design). Do not build a general-purpose order-promotion-audit-log table; that's over-engineering for this epic's scope."
  - severity: low
    description: "Concurrent redemption-count increments under the in-memory Map have no locking."
    mitigation: "Documented as an accepted open item in docs/subsystems/16-promotions.md open question 1, matching every other in-memory reference repo's posture in this codebase."

