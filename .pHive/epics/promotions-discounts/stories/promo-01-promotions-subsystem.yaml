id: promo-01-promotions-subsystem
epic: promotions-discounts
title: "@mercatus-liber/promotions: Promotion domain model, in-memory adapter, evaluate()"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  New package `packages/promotions` (subsystem 16, see docs/subsystems/16-promotions.md,
  already written during planning). Depends on @mercatus-liber/core only -- never imports
  cart, checkout-orders, or catalog (SKU-scoped promotions store bare skuId strings, matched
  against a cart's own line items at evaluation time, not resolved through catalog).

  Deliverables:
  - `Promotion` type + `PromotionKind` ("percentage"|"fixed") + `PromotionScope`
    ("cart"|"product") -- see design-discussion.md §4 for the exact field list.
  - `PromotionRepository` interface (get/list/save, adapter pattern) +
    `createInMemoryPromotionRepository()` reference implementation, structured exactly like
    `packages/cart/src/in-memory-repository.ts` (structuredClone in/out, Map-backed).
  - `PromotionsService` with `createPromotion`, `getPromotion`, `listPromotions`,
    `deactivatePromotion`, and the core computation `evaluate(input): Promise<PromotionEvaluation>`
    where input is `{ items: {skuId, quantity, priceSnapshot: Money}[], couponCode?: string | null }`
    and the result carries adjusted per-line unitAmounts, discountTotal, total, and either
    appliedCode or a rejection reason (unknown_code | expired | not_yet_active |
    usage_limit_reached | below_minimum | none). evaluate() never throws for an invalid/absent
    code -- "no discount applied" is a normal result shape, not an error.
  - Event wiring: subscribe to `checkout.order.paid` (published by checkout-orders, subsystem
    09) to increment `redemptionCount` on the promotion that was actually applied to that
    order -- NOT on `checkout.order.placed` (a merely-started checkout). Since evaluate() is a
    pure computation, the service also needs a way to know which promotion/code was applied to
    a given order at evaluation time; store this as part of the service's own bookkeeping (a
    small in-memory map from an evaluation's returned `appliedCode`/promotion id back to
    increment-on-redeem is enough for the reference implementation -- do not over-engineer this;
    see risk section below). Publish `promotions.redeemed` after incrementing, payload
    `{ promotionId, orderId, discountAmount: Money }`, fire-and-forget (no subscriber depends on
    this yet; it exists for the future internal-BI subsystem per the wider backlog brief).
  - Validation rules for evaluate(): code lookup is case-sensitive exact match; a promotion is
    eligible when `status === "active"`, `startsAt` is null or in the past, `endsAt` is null or
    in the future, `usageLimit` is null or `redemptionCount < usageLimit`, and (cart scope only)
    the cart's pre-discount subtotal >= `minCartAmount` (when set). Product-scope promotions
    apply their discount only to line items whose skuId is in `targetSkuIds`, leaving other
    lines unadjusted. One promotion per evaluate() call: a supplied couponCode takes precedence;
    if none is supplied, apply the single highest-discountTotal-value active auto-applied
    (code === null) promotion, if any are eligible.

acceptance_criteria:
  - "Given a cart-scope fixed promotion with code 'SAVE10' (amount 1000, currency USD) and a cart subtotal of 5000, when evaluate() is called with couponCode 'SAVE10', then discountTotal is {amount:1000,currency:'USD'} and total is 4000"
  - "Given a product-scope percentage promotion (value 20) targeting skuId 'sku-a' only, when evaluate() is called with a cart containing sku-a (price 1000) and sku-b (price 1000, not targeted), then only sku-a's line is discounted (unitAmount 800) and sku-b's line is unchanged (unitAmount 1000)"
  - "Given an expired promotion (endsAt in the past) with a valid-looking code, when evaluate() is called with that code, then the result has appliedCode null and rejectionReason 'expired', with zero discount applied (pass-through unitAmounts)"
  - "Given a usage-limited promotion at its limit (redemptionCount === usageLimit), when evaluate() is called with its code, then rejectionReason is 'usage_limit_reached'"
  - "Given a promotion is applied and checkout.order.paid is published for that order, when the subscriber handles it, then redemptionCount increments by exactly 1 and a promotions.redeemed event is published"
  - "Given checkout.order.paid fires twice for the same orderId (a redelivered event), when the subscriber handles the redelivery, then redemptionCount does not increment a second time (idempotent, same guard pattern as checkout-orders' own payments.payment.succeeded subscriber)"

