design_decisions:
  - decision: "Fallback heuristic runs entirely at the app layer, never inside packages/recommendations."
    rationale: "Keeps the package's own dependency surface at core-only, per design-discussion.md §3 -- the fallback is orchestration, not a package-level capability."

risks:
  - severity: low
    description: "The same-category fallback could return zero results for a product in a category with no siblings, or for a product in no category at all."
    mitigation: "Explicitly covered by the third acceptance criterion -- render nothing, not an empty/awkward section."

