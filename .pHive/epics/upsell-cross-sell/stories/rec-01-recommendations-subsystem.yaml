id: rec-01-recommendations-subsystem
epic: upsell-cross-sell
title: "@mercatus-liber/recommendations: RecommendationRule domain model, in-memory adapter"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  New package packages/recommendations (subsystem 18, see docs/subsystems/18-recommendations.md,
  already written during planning). Depends on @mercatus-liber/core only -- never imports
  catalog, cart, checkout-orders, promotions, bundles, or analytics. This package is
  deliberately thinner than promotions/bundles: it does NOT validate product ids against
  catalog at write time (see design-discussion.md §3 and the subsystem doc's open question 1
  for why) -- it just stores/returns bare productId strings.

  Deliverables:
  - `RecommendationRule` type: { id, sourceProductId: string, label: string, placement:
    "pdp"|"cart"|"both", targetProductIds: string[] (ordered), status: "active"|"inactive" }.
  - `RecommendationRepository` interface (get/list/save, adapter pattern) +
    `createInMemoryRecommendationRepository()` reference implementation, mirroring the
    Map+structuredClone pattern already used in packages/promotions/src/in-memory-repository.ts
    and packages/bundles/src/in-memory-repository.ts.
  - `RecommendationsService` with:
    - `createRule(input: CreateRuleInput): Promise<RecommendationRule>`
    - `getRule(id): Promise<RecommendationRule | null>`
    - `listRules(): Promise<RecommendationRule[]>`
    - `updateRule(id, input: Partial<CreateRuleInput>): Promise<RecommendationRule | null>`
      (mirror bundles' updateBundle get-merge-save shape)
    - `deactivateRule(id): Promise<RecommendationRule | null>`
    - `getRecommendationsForProduct(productId: string, placement?: "pdp"|"cart"|"both"):
      Promise<RecommendationRule[]>` -- returns active rules whose sourceProductId matches,
      optionally filtered further by placement ("both" rules always match regardless of the
      requested placement filter; if no placement filter is given, return all active matching
      rules).
  - Validation on createRule/updateRule: a rule must have at least one targetProductId; reject
    a rule whose sourceProductId appears in its own targetProductIds (a product can't
    recommend itself). No catalog validation (deliberately, per the design decision above).

acceptance_criteria:
  - "Given a rule {sourceProductId:'p1', targetProductIds:['p2','p3'], placement:'pdp', status:'active'}, when getRecommendationsForProduct('p1','pdp') is called, then it returns that rule"
  - "Given the same rule, when getRecommendationsForProduct('p1','cart') is called, then it returns an empty list (placement mismatch)"
  - "Given a rule with placement:'both', when getRecommendationsForProduct(sourceProductId, 'pdp') and getRecommendationsForProduct(sourceProductId, 'cart') are both called, then both return that rule"
  - "Given a createRule call with an empty targetProductIds array, when createRule is called, then it rejects clearly and no rule is persisted"
  - "Given a createRule call where sourceProductId is also present in targetProductIds, when createRule is called, then it rejects clearly and no rule is persisted"
  - "Given an existing rule, when updateRule changes its label, then getRule reflects the new label while preserving its id and targetProductIds"
  - "Given a deactivated rule, when getRecommendationsForProduct is called for its sourceProductId, then it returns an empty list (deactivated rules excluded), while it remains visible via listRules/getRule for admin purposes"

