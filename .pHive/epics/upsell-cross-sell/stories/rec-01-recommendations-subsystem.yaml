design_decisions:
  - decision: "No catalog validation on product ids at write time (unlike promotions/bundles' SKU validation)."
    rationale: "Deliberately thinner package -- see design-discussion.md §3 and subsystem doc's open question 1. A stale product id just silently drops at render time (app-layer resolution), never blocks rule authoring."
  - decision: "'both' placement rules match every placement filter; a rule scoped to exactly one placement only matches that filter."
    rationale: "Simplest possible semantics for a flat placement enum, matching bundles' 'free text, no hardcoded vocabulary beyond the mechanism' posture."

