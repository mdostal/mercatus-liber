    agent: developer
    depends_on: [research]
  - id: test
    description: Write vitest tests in packages/recommendations/test/recommendations.test.ts covering every acceptance criterion above.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Double-check correctness, convention compliance (package.json scoping to core-only, no catalog validation as deliberately scoped), and the self-recommendation rejection.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/upsell-cross-sell.
    agent: developer
    depends_on: [review]

