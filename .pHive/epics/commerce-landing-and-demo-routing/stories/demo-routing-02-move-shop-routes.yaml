design_decisions:
  - decision: "lib/actions.ts is explicitly NOT touched by this piece of work, even though these moved pages call actions from it."
    rationale: "Actions require the admin-routes move to also land first (both route trees' action call sites need matching demoSlug threading), so it's handled once, consistently, in a single later piece of work rather than half-fixed twice."

risks:
  - severity: medium
    description: "Missing even one hardcoded internal link would silently drop a shopper out of their active demo into a now-nonexistent root route."
    mitigation: "The acceptance criteria include an explicit, mechanically-checkable grep proof, not just a manual spot-check."

