name: inventory
title: Inventory
description: >
  Stock levels per SKU (subsystem 11) via a reserve/commit/release pattern:
  reserve on checkout.order.placed, commit (permanent decrement) on
  checkout.order.paid, release on payments.payment.failed -- all
  event-triggered, reading order line items via a narrow structural
  OrderLookup interface, never a direct import of checkout-orders. The
  default in-house adapter deliberately does NOT hard-block on insufficient
  stock (allows backorder/oversell) -- matches a made-to-order 3D-print
  shop's actual reality per the project's own north_star, and avoids an
  event-bus subscriber failure breaking the checkout flow. Hard-block is a
  documented future configuration option, not silently assumed. An
  external-IMS adapter is a contract (the same interface), not a second
  concrete implementation this epic has to build.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
methodology: classic
version_bump: minor
sidecar_retention: transient

git_flow:
  base_branch: master
  branch_strategy: per-epic

stories:
  - id: inv-01-inventory-package
    title: Inventory package (reserve/commit/release, event-driven sync)
    complexity: high
    depends_on: []
  - id: inv-02-reference-storefront-stock-display
    title: Reference storefront -- seeded stock + PDP stock display
    complexity: medium
    depends_on: [inv-01-inventory-package]
