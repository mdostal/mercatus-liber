cross_cutting:
  - concern: subsystem-decoupling
    action: "analytics depends on @mercatus-liber/core only -- one-directional subscriber, never a dependency of any other subsystem, per the doc's own decoupling notes"
  - concern: analytics-on-by-default
    action: "PostHog adapter is the shipped default; swapping to no-op or another provider must be a config change in the consuming app, never a code change in this package"
