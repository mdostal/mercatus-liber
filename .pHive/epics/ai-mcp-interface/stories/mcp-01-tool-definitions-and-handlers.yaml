    action: "ai-interface depends on @mercatus-liber/core only, via structural interfaces for every commerce operation -- same pattern as every other subsystem, even though the subsystem doc itself would permit direct imports"
  - concern: zero-duplicated-business-logic
    action: "Every handler is a thin delegation to its structural-interface dependency -- no validation, pricing, or business rule is reimplemented here"
