name: docs-feature-deep-dive
title: "Real feature deep-dive content on apps/docs + public planning-corpus sync"
description: >
  Epic 33 shipped the docs-site shell/sync mechanism, not deep feature content -- this epic
  adds it. Found and resolved a real, unplanned issue: a concurrent session added a duplicate,
