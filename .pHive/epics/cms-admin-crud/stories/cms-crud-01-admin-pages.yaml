design_decisions:
  - decision: "Section config is edited as raw JSON text, not per-component-type typed fields."
    rationale: "ComponentInstance.config is deliberately opaque/type-varying (docs/subsystems/05-cms-pages.md) -- a single generic editor is the honest simplification, matching design-discussion.md §3."
  - decision: "pageType and slug are not editable after creation."
    rationale: "CmsService.updatePage's own type signature only accepts title/sections -- this story doesn't change that contract, it just calls what already exists."

risks:
  - severity: low
    description: "A raw-JSON textarea is not the friendliest admin UX."
    mitigation: "Acceptable for a reference implementation matching this app's zero-client-JS posture everywhere else; documented as a deliberate tradeoff, not an oversight."

