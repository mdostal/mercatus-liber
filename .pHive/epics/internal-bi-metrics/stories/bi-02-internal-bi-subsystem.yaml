design_decisions:
  - decision: "getInventoryTurns always returns null in the default implementation, never a fabricated or misleading number."
    rationale: "No inventory movement history exists anywhere in this repo (design-discussion.md §4) -- the contract carries the method for a future real adapter, but the default must be honest about what it can't compute."
  - decision: "The funnel event log is populated strictly going forward from when the subscriber is wired -- no attempt to backfill or reconstruct history."
    rationale: "The event bus itself retains nothing; any backfill claim would be fabricated. Matches epic 22's honest treatment of analytics having no read side."

risks:
  - severity: low
    description: "getRevenueOverTime's day/week/month bucketing logic has some inherent complexity (timezone/boundary handling)."
    mitigation: "Use simple UTC-based ISO-string truncation (date portion for day, ISO week number for week, YYYY-MM for month) -- document the exact bucketing rule in a code comment; this is a reference implementation, not a timezone-perfect analytics engine."

