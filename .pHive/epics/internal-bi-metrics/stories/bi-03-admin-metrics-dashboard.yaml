design_decisions:
  - decision: "Plain HTML tables/stat rows, no charting library added."
    rationale: "Matches every other admin page's convention in this app; confirmed no charting dependency exists during planning research, and adding one for a single dashboard page is out of proportion for a reference implementation."

risks:
  - severity: low
    description: "The structural adapters bridging checkout/catalog/promotions' real service method signatures onto OrderMetricsSource/SkuMetricsSource/PromotionMetricsSource might not be a perfect 1:1 shape match."
    mitigation: "Small inline shim objects at the services.ts wiring site are fine and expected -- this is exactly what 'structural interface satisfied by an existing service' looks like when the shapes need light adaptation, same as every other epic's wiring in this wave."

