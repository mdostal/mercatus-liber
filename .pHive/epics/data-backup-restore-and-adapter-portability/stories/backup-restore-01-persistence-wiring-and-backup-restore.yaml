    change: "Add DATABASE_URL/SQLITE_FILE_PATH env-var branches, 3-state, in-memory default unchanged"
  - file: apps/reference-storefront/lib/adapter-info.ts
    change: "Add a Persistence row"
  - file: packages/adapter-sqlite
    change: "New backup/restore CLI script + README section"

design_decisions:
  - decision: "SQLite backup/restore uses a real safe-copy mechanism (e.g. VACUUM INTO), never a raw filesystem copy of a live database file."
    rationale: "A raw copy of an open SQLite file can be corrupted mid-write -- this must be genuinely safe, not just apparently working in a quick test."

risks:
  - severity: medium
    description: "An unsafe backup mechanism could silently produce corrupted backups that only fail on restore, long after the fact."
    mitigation: "Acceptance criteria explicitly requires a real round-trip proof, not just 'the backup command ran successfully.'"

