id: backup-restore-03-verification-and-closeout
epic: data-backup-restore-and-adapter-portability
title: "Live verification (restart survival, backup/restore round-trip), closeout, merge"
status: pending
complexity: low
methodology: classic
depends_on: [backup-restore-02-capability-matrix-docs-extension]

description: |
  Read both prior stories' committed changes in full first.

  1. Live verification: start a real dev server with SQLITE_FILE_PATH set to a real temp file
     path, seed real demo data, stop the server, restart it with the same SQLITE_FILE_PATH,
     confirm the previously-seeded data is genuinely still there (proving real persistence
     survives a restart, unlike the default in-memory mode). Run a real backup against this
     live file, then a real restore into a fresh path, and confirm the restored database
     contains the exact same real data (row counts/specific known records match). Confirm the
     unset-env-vars default still behaves exactly as before this epic (ephemeral, in-memory).
  2. Run the full monorepo test/typecheck/build via root turbo commands, confirm green.
  3. Update .pHive/planning/epic-backlog.md: change epic 39's row to "done (3/3 stories
     complete)", with a description naming the real finding (persistence had zero env-branch,
     every demo's data was ephemeral), the resolution (3-state env wiring + real SQLite backup/
     restore), and the docs extension -- matching the style/detail of surrounding rows.
  4. Commit and merge feat/data-backup-restore-and-adapter-portability into master with --no-ff,
     mirroring the "Merge epic: <name> (epic NN)" convention from prior epic merges.

acceptance_criteria:
  - "Given a real server restart with SQLITE_FILE_PATH set, then previously-seeded real data is genuinely still present after restart"
  - "Given a real backup-then-restore round trip against that live data, then the restored database contains the exact same real data"
  - "Given neither env var set, then behavior is confirmed unchanged from before this epic (ephemeral, in-memory)"
  - "Given the full monorepo test/typecheck/build via turbo, then all are green"
  - "Given .pHive/planning/epic-backlog.md, then epic 39's row reads done (3/3 stories complete) with an accurate, specific description"
  - "Given git log after this story, then master shows a clean --no-ff merge commit for this epic with no conflicts"

steps:
  - id: implement
    description: Run all verification steps and make the docs/backlog updates per the description above.
    agent: developer
  - id: test
    description: Confirm every acceptance criterion with real, observed evidence.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Double-check the epic-backlog.md edit is accurate and the merge is clean.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/data-backup-restore-and-adapter-portability, then merge --no-ff to master.
    agent: developer
    depends_on: [review]

