name: vision-and-community-roadmap
title: "Publish VISION.md live on the docs site, refresh its now-stale progress sections"
description: >
  VISION.md already exists with real "done / in progress / wanted, not started" content, but
  was never actually synced/published anywhere -- confirmed by reading sync-content.mjs, which
  syncs README.md/ARCHITECTURE.md but not VISION.md. Also stale: 7 more epics (34-39, 45)
  completed since it was written and are still listed as "in progress." Resolved: sync the
  existing file (mirroring the established README/ARCHITECTURE pattern) rather than authoring
  a second, driftable roadmap page; refresh its content against real current epic-backlog.md
  state; link it prominently from both the docs site nav and the framework landing page. See
  docs/design-discussion.md.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
