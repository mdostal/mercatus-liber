name: cms-pages
title: CMS (5 page types + components)
description: >
  Per-page CMS (subsystem 05) -- not whole-site theming (that's already
  covered by 06). Content models for the 5 founder-specified page types:
  home (hero/ad/category-spot components), category (data from
  marketing-catalog), marketing/campaign page (its own mini-catalog, e.g. a
  "Fall Sale"), search and PDP (already have working pages from prior
  epics -- this epic wires their layout selection through theming's registry
  the same way PDP already does, rather than rebuilding them). A component
  registry (hero banner, ad slot, category spot, product grid) is the
  composable building block every page type's content references by id.
  Closes with the reference storefront's home page becoming CMS-authored
  instead of hardcoded, plus one live marketing/campaign page example.
target_codebase: /Users/mdostal/Documents/work/personal/mercatus-liber
methodology: classic
version_bump: minor
sidecar_retention: transient

git_flow:
  base_branch: master
  branch_strategy: per-epic

stories:
  - id: cms-01-cms-package
    title: CMS package (page content models, component registry, draft/published)
    complexity: high
    depends_on: []
  - id: cms-02-reference-storefront-cms-home-and-marketing-page
    title: Reference storefront -- CMS-authored home page + one marketing/campaign page
    complexity: medium
    depends_on: [cms-01-cms-package]
