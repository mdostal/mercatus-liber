    relevant_excerpt: |
      Full design rationale this epic's live verification demonstrates end-to-end.

cross_cutting: []

metric:
  applies: false
  justification: "Closeout story verified via the acceptance criteria's manual golden-path check; epic-backlog.md's done status is qualitative."
