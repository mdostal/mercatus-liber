  - file: apps/docs/.gitignore
    change: New file, excludes content/ (build artifact) and .next/.

design_decisions:
  - decision: "apps/docs/content/ is a gitignored build artifact, regenerated by predev/prebuild, never committed."
    rationale: "Keeps docs/ at the repo root as the one real source of truth -- committing a synced copy would recreate the exact duplication risk this epic's design explicitly avoids."

risks:
  - severity: medium
    description: "Next 16 might not actually work cleanly with Nextra in practice despite the research's optimistic peer-range reading."
    mitigation: "The story explicitly authorizes falling back to Next 15.x for this app only if genuinely needed, with the deviation clearly reported."

