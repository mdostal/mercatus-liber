name: six-themes
title: Six Optional Themes
description: >
  Theme bundles (docs/subsystems/06-theming-layout.md's "an optional,
  higher-level grouping of layout choices + style tokens... applied across
  the whole site") -- 6 drop-in presets built entirely on the existing
  theming primitives from epic 3 (registerTemplate/setDefaultTemplate/
  setTokens), proving a theme is sugar over those primitives, not a separate
  forced mechanism per docs/ARCHITECTURE.md principle 3. Closes with the
  reference storefront applying a selectable theme's style tokens as real
  CSS custom properties, visibly changing the site's look.
