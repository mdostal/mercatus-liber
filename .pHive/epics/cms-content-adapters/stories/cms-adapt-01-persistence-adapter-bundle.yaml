id: cms-adapt-01-persistence-adapter-bundle
epic: cms-content-adapters
title: CmsPersistenceAdapter bundle -- createCmsService refactor, createInMemoryCmsAdapter
status: done
complexity: small
methodology: classic
depends_on: []

description: |
  Add CmsPersistenceAdapter { pages: PageRepository; marketingMeta:
  MarketingPageMetaRepository } to packages/cms/src/types.ts -- the same
  bundled-interface shape CatalogPersistenceAdapter already established.
  Refactor createCmsService to take { persistence: CmsPersistenceAdapter;
  components: ComponentRegistry } instead of three loose top-level params.
  Add createInMemoryCmsAdapter() bundling the existing two in-memory
  repositories, mirroring adapter-sqlite's convenience-factory pattern.
  Update all 3 call sites (cms's own tests, reference-storefront's
  lib/services.ts and test/helpers.ts).

acceptance_criteria:
  - "Given CmsPersistenceAdapter, when inspected, then it has exactly { pages, marketingMeta } -- same bundled shape as CatalogPersistenceAdapter"
  - "Given createCmsService, when called, then its signature is { persistence: CmsPersistenceAdapter; components: ComponentRegistry } -- no more loose pages/marketingMeta top-level params"
  - "Given createInMemoryCmsAdapter(), when used, then it behaves identically to the previous createInMemoryPageRepository() + createInMemoryMarketingPageMetaRepository() pairing -- no behavior change, only a shape change"
  - "Given every existing CMS test, when run after the refactor, then all still pass unmodified in behavior (only wiring syntax changes)"

steps:
  - id: research
    description: Re-read CatalogPersistenceAdapter's exact shape and all 3 current createCmsService call sites.
    agent: researcher
  - id: implement
    description: Add CmsPersistenceAdapter type, createInMemoryCmsAdapter factory, refactor createCmsService and all call sites.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run full existing CMS + reference-storefront test suites to confirm no behavior regression.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the refactor is purely a shape change -- no persistence behavior differs.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

