design_decisions:
  - decision: "Fixed-slot plain-HTML tier form (no client-side dynamic add-row) with a fixed generous slot count."
    rationale: "Matches this app's zero-client-JS-framework posture (same reasoning epic 20's promotions admin UI documented) -- this is a reference/demo admin console, not a production-grade form builder."

risks:
  - severity: low
    description: "A fixed slot count (e.g. 5 tiers x 6 SKUs) is an arbitrary ceiling."
    mitigation: "Generous enough for the 3-tier acceptance shape and any realistic bundle; documented as a known reference-implementation limitation, not silently hidden."

