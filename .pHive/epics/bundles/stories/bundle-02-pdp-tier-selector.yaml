design_decisions:
  - decision: "Tier selection adds each constituent SKU at quantity 1, with no quantity selector on the tier form itself."
    rationale: "A package tier is 'one of this configuration,' not a quantity control -- matches the ATT acceptance shape (you pick Product Only vs. + Pro Setup vs. Complete Overhaul, you don't specify how many of the whole package)."

