    agent: developer
    depends_on: [research]
  - id: test
    description: Manually verify the golden path (no-bundle product unchanged, bundled product shows tiers with correct prices, selecting a tier adds the right cart lines) via a dev server; add automated coverage if this app has any test harness for its routes/actions, otherwise document the manual verification steps taken.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Double-check the zero-regression claim for non-bundled products and that packages/pdp itself was not modified.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/bundles.
    agent: developer
    depends_on: [review]

