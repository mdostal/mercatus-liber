    description: "packages/pdp itself stays untouched, so a future deployment wanting bundle data inside pdp's own PdpViewModel (rather than app-composed) would need a separate follow-up change."
    mitigation: "Explicitly documented as the resolution to PDP's open question 1 in docs/subsystems/04-pdp.md and design-discussion.md §5 -- not an oversight."

