id: bundle-01-bundles-subsystem
epic: bundles
title: "@mercatus-liber/bundles: Bundle/BundleTier domain model, in-memory adapter, tier pricing"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  New package packages/bundles (subsystem 17, see docs/subsystems/17-bundles.md, already
  written during planning). Depends on @mercatus-liber/core only -- never imports cart,
  checkout-orders, promotions, or inventory. Declares its own narrow SkuPriceLookup structural
  interface (satisfied by catalog's CatalogService, never imported directly) to validate
  skuIds and compute a tier's live sum-of-parts price.

  Deliverables:
  - `Bundle` type: { id, productId (the base product this bundle is attached to), title,
    tiers: BundleTier[], status: "active"|"inactive" }.
  - `BundleTier` type: { id, label (free text, e.g. "Product Only"/"+ Pro Setup"/"Complete
    Overhaul" -- no hardcoded vocabulary), skuIds: string[] (the FULL set of SKUs to add when
    this tier is selected, not a delta from the prior tier) }.
  - `BundleRepository` interface (get/list/save, adapter pattern) +
    `createInMemoryBundleRepository()` reference implementation, mirroring the Map+
    structuredClone pattern already used in packages/cart/src/in-memory-repository.ts and
    packages/promotions/src/in-memory-repository.ts.
  - `SkuPriceLookup` structural interface: `{ getSku(id: string): Promise<{ id, price: Money,
    title?: string } | null> }` or the narrowest shape actually needed -- read
    packages/promotions/src/types.ts and packages/cart/src/types.ts's own SkuLookup-style
    interfaces first for the exact doc-comment convention to match (each subsystem declares
    its own copy of this kind of interface, never imports another package's).
  - `BundlesService` with:
    - `createBundle(input): Promise<Bundle>`
    - `getBundle(id): Promise<Bundle | null>`
    - `getBundleForProduct(productId): Promise<Bundle | null>` -- the PDP-facing read; returns
      the first active bundle attached to that product, or null. Assume at most one active
      bundle per product for v1 (simplifying assumption -- note it in a code comment).
    - `listBundles(): Promise<Bundle[]>`
    - `updateBundle(id, input): Promise<Bundle | null>` (mirror promotions' updatePromotion
      get-merge-save shape, added there for its own admin edit story)
    - `deactivateBundle(id): Promise<Bundle | null>`
    - `computeTierPricing(bundleId, tierId): Promise<{ total: Money; lines: { skuId: string;
      title: string; unitAmount: Money }[] } | null>` -- looks up the bundle+tier, resolves
      each skuId via SkuPriceLookup, sums the Money amounts (validate all SKUs share one
      currency; throw or return null on a currency mismatch -- pick one and document it),
      returns null if the bundle/tier isn't found.
  - Validation on createBundle/updateBundle: every skuId in every tier must resolve via
    SkuPriceLookup (reject/throw with a clear error naming the missing skuId otherwise); a
    bundle must have at least one tier; a tier must have at least one skuId.

acceptance_criteria:
  - "Given a bundle with tiers [{label:'Product Only', skuIds:['a']}, {label:'+ Pro Setup', skuIds:['a','b']}, {label:'Complete Overhaul', skuIds:['a','b','c']}] where a/b/c have prices 10000/5000/8000 (cents, USD), when computeTierPricing is called for the 'Complete Overhaul' tier, then it returns total {amount:23000,currency:'USD'} and 3 lines"
  - "Given a product with an active bundle attached, when getBundleForProduct(productId) is called, then it returns that bundle"
  - "Given a product with no bundle attached, when getBundleForProduct(productId) is called, then it returns null"
  - "Given a createBundle call referencing a skuId that SkuPriceLookup cannot resolve, when createBundle is called, then it rejects clearly naming the missing skuId, and no Bundle is persisted"
  - "Given an existing bundle, when updateBundle changes its title, then getBundle reflects the new title while preserving its id and tiers"
  - "Given a deactivated bundle, when getBundleForProduct is called for its product, then it returns null (deactivated bundles are excluded from the PDP-facing lookup, still visible via listBundles/getBundle for admin purposes)"

steps:
  - id: research
    description: Read packages/promotions/src/types.ts, in-memory-repository.ts, and service.ts (all committed on master) for the exact structural-interface and repository patterns to mirror in this new package.
    agent: researcher
  - id: implement
    description: Build the bundles package per the description above.
    agent: developer
    depends_on: [research]
  - id: test
    description: Write vitest tests in packages/bundles/test/bundles.test.ts covering every acceptance criterion above.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Double-check correctness, convention compliance (structural-interface naming, package.json scoping to core-only), and the "at most one active bundle per product" assumption is documented, not silently baked in.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/bundles.
    agent: developer
    depends_on: [review]

