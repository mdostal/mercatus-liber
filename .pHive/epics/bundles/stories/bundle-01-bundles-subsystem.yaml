design_decisions:
  - decision: "At most one active bundle per product for v1."
    rationale: "The 3-tier acceptance shape is one bundle with 3 tiers, not 3 competing bundles on one product. Keeps getBundleForProduct's return type a single nullable Bundle rather than a list, simplest possible PDP integration. Documented explicitly rather than silently assumed."
  - decision: "computeTierPricing recomputes from live catalog prices on every call, never caches into the Bundle record."
    rationale: "Guarantees the PDP's displayed price and the cart's actual line-item total can never drift out of sync, since both ultimately read the same catalog SKU prices -- see design-discussion.md §4."

risks:
  - severity: low
    description: "A tier's constituent SKUs could theoretically span multiple currencies."
    mitigation: "Validate all constituent SKUs share one currency in computeTierPricing; document the chosen failure behavior (reject clearly) rather than silently summing mismatched currencies."

