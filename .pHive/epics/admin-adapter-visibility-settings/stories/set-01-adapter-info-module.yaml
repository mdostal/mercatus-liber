    agent: tester
    depends_on: [implement]
  - id: review
    description: Double-check the honesty requirement -- no fabricated env-var branches for persistence/CMS that don't actually exist in services.ts, and the no-op-analytics-is-not-an-error framing.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/admin-adapter-visibility-settings.
    agent: developer
    depends_on: [review]

