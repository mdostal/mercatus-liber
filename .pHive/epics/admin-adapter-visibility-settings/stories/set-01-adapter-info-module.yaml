    change: New file, getAdapterInfo() per the description above.

design_decisions:
  - decision: "adapter-info.ts reads process.env directly rather than deriving from a running services instance."
    rationale: "Keeps this module trivially pure/testable and avoids any risk of it needing to construct or touch real adapters (e.g. actually instantiating Stripe) just to describe them -- it reports what services.ts WOULD choose given the current environment, mirroring that file's own env-reading logic exactly."
  - decision: "A no-op analytics adapter is reported as status 'active', never 'unconfigured'."
    rationale: "This repo treats the no-op analytics adapter as a deliberately valid, fully-functional default (see docs/subsystems/13-analytics-tracking.md) -- reporting it as an error/unconfigured state would misrepresent an intentional, correct configuration."

