    complexity: low
    depends_on: []
  - id: set-02-admin-settings-page-and-closeout
    title: "/admin/settings page, nav link, live verification, epic-backlog closeout (final epic of the hand-off brief)"
    complexity: low
    depends_on: [set-01-adapter-info-module]
