    title: "@mercatus-liber/advertising: Campaign/Creative domain model, in-memory adapter, weighted rotation"
    complexity: medium
    depends_on: []
  - id: ad-02-cms-ad-slot-integration
    title: "reference-storefront: real ad-slot rendering via getActiveCreativeForSlot, service-area + page-slug targeting"
    complexity: medium
    depends_on: [ad-01-advertising-subsystem]
  - id: ad-03-admin-advertising-crud
    title: "/admin/advertising: list + create/edit/deactivate campaigns with nested creatives"
    complexity: medium
    depends_on: [ad-01-advertising-subsystem]
  - id: ad-04-acceptance-seed-and-closeout
