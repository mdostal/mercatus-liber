design_decisions:
  - decision: "random is an injectable dependency on getActiveCreativeForSlot, defaulting to Math.random."
    rationale: "Makes the weighted-selection logic deterministically testable without needing statistical/distribution-based test assertions."
  - decision: "No catalog/service-areas/cms validation of targeting ids at write time."
    rationale: "Matches recommendations' deliberately thin posture -- see design-discussion.md §3 and the subsystem doc's open question 1."

