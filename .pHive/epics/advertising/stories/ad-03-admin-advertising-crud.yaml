design_decisions:
  - decision: "Fixed-slot plain-HTML creative form (no client-side dynamic add-row), mirroring bundles' tiers exactly."
    rationale: "Same zero-client-JS-framework posture documented in every prior epic's admin story this wave."

risks:
  - severity: low
    description: "A fixed slot count (e.g. 5 creatives) is an arbitrary ceiling."
    mitigation: "Generous enough for a demo/reference campaign; documented as a known reference-implementation limitation, matching bundles' identical tradeoff."

