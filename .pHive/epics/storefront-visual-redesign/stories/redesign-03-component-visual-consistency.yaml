    description: "A broad styling pass across many components risks missing one, leaving an inconsistent spot."
    mitigation: "The acceptance criteria ask for 'meaningfully reduced' duplication, not perfect zero-hardcoded-values -- a real, bounded, honest pass, not a perfection claim."

